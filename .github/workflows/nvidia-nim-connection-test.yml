name: nvidia-nim-connection-test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nvidia-nim-connection-test.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Probe NVIDIA NIM safely
        shell: bash
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_NIM_MODEL: ${{ vars.NVIDIA_NIM_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b' }}
          NVIDIA_NIM_BASE_URL: ${{ vars.NVIDIA_NIM_BASE_URL || 'https://integrate.api.nvidia.com/v1' }}
        run: |
          set -euo pipefail
          set +x

          if [ -z "${NVIDIA_NIM_API_KEY:-}" ]; then
            echo "SECRET_PRESENT=false"
            echo "NVIDIA NIM probe: repository/environment secret is missing or empty." >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi

          echo "SECRET_PRESENT=true"

          catalog_code=$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --output /tmp/nvidia-models.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${NVIDIA_NIM_API_KEY}" \
            --header 'Accept: application/json' \
            "${NVIDIA_NIM_BASE_URL%/}/models")

          printf 'CATALOG_HTTP=%s\n' "$catalog_code"

          infer_code=$(curl --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --output /tmp/nvidia-inference.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${NVIDIA_NIM_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data "{\"model\":\"${NVIDIA_NIM_MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with exactly OK.\"}],\"temperature\":0,\"max_tokens\":8}" \
            "${NVIDIA_NIM_BASE_URL%/}/chat/completions")

          printf 'INFERENCE_HTTP=%s\n' "$infer_code"

          {
            echo '## NVIDIA NIM connection test'
            echo "- Secret present: yes"
            echo "- Catalog HTTP: ${catalog_code}"
            echo "- Inference HTTP: ${infer_code}"
            echo "- Model: ${NVIDIA_NIM_MODEL}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$catalog_code" = "200" ] && [ "$infer_code" = "200" ]; then
            echo 'NVIDIA_NIM_CONNECTION=PASS'
            exit 0
          fi

          echo 'NVIDIA_NIM_CONNECTION=FAIL'
          exit 1
