name: nvidia-api-probe

on:
  push:
    branches:
      - probe/nvidia-api-connection-20260911
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
      NVIDIA_MODEL: nvidia/nemotron-3-ultra-550b-a55b
    steps:
      - name: Safe NVIDIA connection probe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          primary = os.environ.get("NVIDIA_API_KEY", "").strip()
          legacy = os.environ.get("NVIDIA_NIM_API_KEY", "").strip()
          if primary:
              api_key = primary
              credential_source = "NVIDIA_API_KEY"
          elif legacy:
              api_key = legacy
              credential_source = "NVIDIA_NIM_API_KEY"
          else:
              print("credential_present=false")
              print("catalog_auth_ok=false")
              print("inference_ok=false")
              sys.exit(2)

          print("credential_present=true")
          print(f"credential_source={credential_source}")
          base = os.environ["NVIDIA_BASE_URL"].rstrip("/")
          model = os.environ["NVIDIA_MODEL"]
          headers = {"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"}

          def request(url, *, method="GET", payload=None, timeout=45):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, b""

          catalog_status, catalog_body = request(f"{base}/models")
          print(f"catalog_http_status={catalog_status}")
          catalog_ok = 200 <= catalog_status < 300
          print(f"catalog_auth_ok={'true' if catalog_ok else 'false'}")

          payload = {
              "model": model,
              "messages": [{"role": "user", "content": "Reply exactly with NVIDIA_CONNECTION_OK"}],
              "max_tokens": 16,
              "temperature": 0,
          }
          inference_status, inference_body = request(
              f"{base}/chat/completions", method="POST", payload=payload, timeout=90
          )
          print(f"inference_http_status={inference_status}")
          inference_ok = 200 <= inference_status < 300
          if inference_ok:
              try:
                  parsed = json.loads(inference_body.decode("utf-8"))
                  text = parsed["choices"][0]["message"]["content"]
                  semantic_ok = "NVIDIA_CONNECTION_OK" in text
              except Exception:
                  semantic_ok = False
          else:
              semantic_ok = False
          print(f"inference_ok={'true' if inference_ok else 'false'}")
          print(f"semantic_probe_ok={'true' if semantic_ok else 'false'}")

          if not (catalog_ok and inference_ok and semantic_ok):
              sys.exit(3)
          PY
