name: YouTube read-only MCP offline tests

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/meta_facebook_mcp_publisher/youtube_readonly.py"
      - "src/meta_facebook_mcp_publisher/youtube_readonly_mcp.py"
      - "tests/test_youtube_readonly.py"
      - "tests/test_youtube_mcp_contract.py"
      - "tests/test_youtube_oauth_contract.py"
      - "src/meta_facebook_mcp_publisher/youtube_oauth_contract.py"
      - ".github/workflows/youtube-readonly-mcp-ci.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "src/meta_facebook_mcp_publisher/youtube_readonly.py"
      - "src/meta_facebook_mcp_publisher/youtube_readonly_mcp.py"
      - "tests/test_youtube_readonly.py"
      - "tests/test_youtube_mcp_contract.py"
      - "tests/test_youtube_oauth_contract.py"
      - "src/meta_facebook_mcp_publisher/youtube_oauth_contract.py"
      - ".github/workflows/youtube-readonly-mcp-ci.yml"

permissions:
  contents: read

jobs:
  test-offline-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile source and tests
        run: python -m compileall -q src/meta_facebook_mcp_publisher/youtube_readonly.py src/meta_facebook_mcp_publisher/youtube_readonly_mcp.py tests/test_youtube_readonly.py
      - name: Test fail-closed GET-only adapter without tokens or network
        env:
          PYTHONPATH: src
          YOUTUBE_READONLY_ACCESS_TOKEN: ""
        run: python -m unittest discover -s tests -p 'test_youtube_readonly.py' -v
      - name: Install optional MCP v2 SDK and validate server can register offline
        shell: bash
        env:
          YOUTUBE_READONLY_ACCESS_TOKEN: ""
        run: |
          set -euo pipefail
          python -m pip install '.[youtube-mcp]'
          python - <<'PY'
          from mcp.server.mcpserver import MCPServer
          from meta_facebook_mcp_publisher.youtube_readonly_mcp import mcp
          assert isinstance(mcp, MCPServer)
          print("MCP_V2_IMPORT=PASS")
          print("MCP_LOCAL_STDIO_READY=PASS")
          PY
      - name: Test Google OAuth PKCE and read-only scope policy offline
        run: python -m unittest discover -s tests -p 'test_youtube_oauth_contract.py' -v
      - name: Test MCP v2 protocol and fail-closed authorization
        env:
          YOUTUBE_READONLY_ACCESS_TOKEN: ""
          YOUTUBE_EXPECTED_CHANNEL_ID: ""
        run: python -m unittest discover -s tests -p 'test_youtube_mcp_contract.py' -v
      - name: Reject publishing permissions and uploads in read-only surface
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'youtube\.upload|force-ssl|upload/youtube|videos\.insert|videos\.update|videos\.delete' src/meta_facebook_mcp_publisher/youtube_readonly.py
          ! grep -Eq 'youtube\.upload|force-ssl|upload/youtube|videos\.insert|videos\.update|videos\.delete' src/meta_facebook_mcp_publisher/youtube_readonly_mcp.py
          grep -Fq 'transport="stdio"' src/meta_facebook_mcp_publisher/youtube_readonly_mcp.py
          echo 'YOUTUBE_READONLY_NO_MUTATION_SURFACE=PASS'
