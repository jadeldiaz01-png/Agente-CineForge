name: social-video-publisher

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated platforms: facebook,youtube,tiktok,x"
        required: true
        default: "facebook,youtube,tiktok,x"
      video_path:
        description: "Path to approved MP4 artifact inside the repository or workflow workspace"
        required: true
        default: "artifacts/approved-video.mp4"
      caption:
        description: "Approved caption/description"
        required: true
      youtube_title:
        description: "YouTube title (optional; defaults to the video filename)"
        required: false
        default: ""
      youtube_tags:
        description: "Comma-separated YouTube tags"
        required: false
        default: ""
      youtube_privacy_status:
        description: "YouTube visibility"
        required: true
        type: choice
        options: ["private", "unlisted", "public"]
        default: "private"
      youtube_made_for_kids:
        description: "Is this video made for kids?"
        required: true
        type: choice
        options: ["true", "false"]
        default: "false"
      dry_run:
        description: "Validate execution without calling external APIs"
        required: true
        type: boolean
        default: true
      human_approved:
        description: "Final human approval for external publication"
        required: true
        type: boolean
        default: false
      video_qc_passed:
        description: "Confirm independent video QC passed"
        required: true
        type: boolean
        default: false
      originality_reviewed:
        description: "Confirm originality and rights review passed"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install publisher package
        run: python -m pip install .

      - name: Validate package
        run: python -m compileall -q src tests

      - name: Publish approved video
        env:
          META_GRAPH_VERSION: v26.0
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PUBLISHING_ENABLED: ${{ vars.META_PUBLISHING_ENABLED || 'false' }}
          META_REELS_DAILY_LIMIT: ${{ vars.META_REELS_DAILY_LIMIT || '30' }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_OAUTH_ACCESS_TOKEN: ${{ secrets.YOUTUBE_OAUTH_ACCESS_TOKEN }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_PUBLISHING_ENABLED: ${{ vars.YOUTUBE_PUBLISHING_ENABLED || 'false' }}
          YOUTUBE_PUBLIC_POSTING_AUDITED: ${{ vars.YOUTUBE_PUBLIC_POSTING_AUDITED || 'false' }}
          YOUTUBE_DAILY_UPLOAD_LIMIT: ${{ vars.YOUTUBE_DAILY_UPLOAD_LIMIT || '6' }}
          INPUT_VIDEO_PATH: ${{ inputs.video_path }}
          INPUT_CAPTION: ${{ inputs.caption }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_HUMAN_APPROVED: ${{ inputs.human_approved }}
          INPUT_VIDEO_QC_PASSED: ${{ inputs.video_qc_passed }}
          INPUT_ORIGINALITY_REVIEWED: ${{ inputs.originality_reviewed }}
          YOUTUBE_TITLE: ${{ inputs.youtube_title }}
          YOUTUBE_TAGS: ${{ inputs.youtube_tags }}
          YOUTUBE_PRIVACY_STATUS: ${{ inputs.youtube_privacy_status }}
          YOUTUBE_MADE_FOR_KIDS: ${{ inputs.youtube_made_for_kids }}
          TIKTOK_ACCOUNT_ID: ${{ secrets.TIKTOK_ACCOUNT_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_PUBLISHING_ENABLED: ${{ vars.TIKTOK_PUBLISHING_ENABLED || 'false' }}
          TIKTOK_PUBLIC_POSTING_AUDITED: ${{ vars.TIKTOK_PUBLIC_POSTING_AUDITED || 'false' }}
          TIKTOK_DAILY_POST_LIMIT: ${{ vars.TIKTOK_DAILY_POST_LIMIT || '30' }}
          X_ACCOUNT_ID: ${{ secrets.X_ACCOUNT_ID }}
          X_USER_ACCESS_TOKEN: ${{ secrets.X_USER_ACCESS_TOKEN }}
          X_PUBLISHING_ENABLED: ${{ vars.X_PUBLISHING_ENABLED || 'false' }}
          X_DAILY_POST_LIMIT: ${{ vars.X_DAILY_POST_LIMIT || '17' }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [ "$INPUT_HUMAN_APPROVED" = "true" ]; then
            FLAGS+=(--human-approved)
          fi
          if [ "$INPUT_VIDEO_QC_PASSED" = "true" ]; then
            FLAGS+=(--video-qc-passed)
          fi
          if [ "$INPUT_ORIGINALITY_REVIEWED" = "true" ]; then
            FLAGS+=(--originality-reviewed)
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            FLAGS+=(--dry-run)
          fi
          YOUTUBE_ARGS=(--privacy-status "$YOUTUBE_PRIVACY_STATUS" --made-for-kids "$YOUTUBE_MADE_FOR_KIDS")
          if [ -n "$YOUTUBE_TITLE" ]; then
            YOUTUBE_ARGS+=(--title "$YOUTUBE_TITLE")
          fi
          if [ -n "$YOUTUBE_TAGS" ]; then
            YOUTUBE_ARGS+=(--tags "$YOUTUBE_TAGS")
          fi
          python -m meta_facebook_mcp_publisher.cli \
            --video "$INPUT_VIDEO_PATH" \
            --caption "$INPUT_CAPTION" \
            --platforms "$INPUT_PLATFORMS" \
            --idempotency-key "${{ github.run_id }}-${{ github.run_attempt }}" \
            "${FLAGS[@]}" "${YOUTUBE_ARGS[@]}"
