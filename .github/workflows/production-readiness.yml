name: production-readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install controlled test toolchain
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.4.2 .

      - name: Compile source
        run: python -m compileall -q src tests scripts

      - name: Run production-readiness manifest validator
        run: python scripts/validate_production_readiness.py

      - name: Run unit integration and adversarial tests
        run: python -m pytest -q

      - name: Require immutable third-party Actions
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          failures=[]
          for p in Path('.github/workflows').glob('*.y*ml'):
              for n,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
                  m=re.search(r'\buses:\s*([^\s#]+)', line)
                  if m and not m.group(1).startswith('./') and not re.search(r'@[0-9a-fA-F]{40}$', m.group(1)):
                      failures.append(f'{p}:{n}:{m.group(1)}')
          if failures:
              print('\n'.join(failures))
              raise SystemExit('IMMUTABLE_ACTIONS=FAIL')
          print('IMMUTABLE_ACTIONS=PASS')
          PY

      - name: Generate runtime dependency SPDX SBOM
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import importlib.metadata as md
          import json
          import os
          import pathlib
          import re
          import uuid
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name

          root_name = canonicalize_name("meta-facebook-mcp-publisher")
          queue = [root_name]
          distributions = {}
          dependencies = {}

          while queue:
              name = canonicalize_name(queue.pop(0))
              if name in distributions:
                  continue
              dist = md.distribution(name)
              distributions[name] = dist
              direct = set()
              for raw_requirement in dist.requires or []:
                  requirement = Requirement(raw_requirement)
                  if requirement.marker and not requirement.marker.evaluate():
                      continue
                  dependency = canonicalize_name(requirement.name)
                  direct.add(dependency)
                  queue.append(dependency)
              dependencies[name] = sorted(direct)

          package_ids = {}
          packages = []
          for name in sorted(distributions):
              dist = distributions[name]
              version = dist.version
              package_id = "SPDXRef-Package-" + hashlib.sha256(
                  f"{name}@{version}".encode("utf-8")
              ).hexdigest()[:20]
              package_ids[name] = package_id
              packages.append({
                  "SPDXID": package_id,
                  "name": name,
                  "versionInfo": version,
                  "downloadLocation": "NOASSERTION",
                  "filesAnalyzed": False,
                  "licenseConcluded": "NOASSERTION",
                  "licenseDeclared": "NOASSERTION",
                  "copyrightText": "NOASSERTION",
                  "externalRefs": [{
                      "referenceCategory": "PACKAGE-MANAGER",
                      "referenceType": "purl",
                      "referenceLocator": f"pkg:pypi/{name}@{version}",
                  }],
              })

          relationships = [{
              "spdxElementId": "SPDXRef-DOCUMENT",
              "relationshipType": "DESCRIBES",
              "relatedSpdxElement": package_ids[root_name],
          }]
          for source in sorted(dependencies):
              for target in dependencies[source]:
                  if target in package_ids:
                      relationships.append({
                          "spdxElementId": package_ids[source],
                          "relationshipType": "DEPENDS_ON",
                          "relatedSpdxElement": package_ids[target],
                      })

          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          repository = os.environ["GITHUB_REPOSITORY"]
          namespace_id = uuid.uuid5(uuid.NAMESPACE_URL, f"{repository}/{run_id}/{attempt}")
          doc = {
              "spdxVersion": "SPDX-2.3",
              "dataLicense": "CC0-1.0",
              "SPDXID": "SPDXRef-DOCUMENT",
              "name": "cineforge-runtime-dependency-sbom",
              "documentNamespace": f"https://jadeltechrd.com/spdx/cineforge/{namespace_id}",
              "creationInfo": {
                  "creators": ["Tool: cineforge-production-readiness"],
                  "created": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              },
              "packages": packages,
              "relationships": relationships,
          }
          output = pathlib.Path("artifacts/sbom.spdx.json")
          output.parent.mkdir(exist_ok=True)
          output.write_text(json.dumps(doc, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"SBOM_RUNTIME_PACKAGES={len(packages)}")
          print(f"SBOM_CREATED={doc['creationInfo']['created']}")
          PY

      - name: Upload readiness evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cineforge-production-readiness-${{ github.sha }}
          path: |
            config/production-readiness.json
            artifacts/sbom.spdx.json
          if-no-files-found: error
