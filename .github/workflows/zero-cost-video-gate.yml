name: zero-cost-video-gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zero-cost-video-gate.yml"
      - "config/free-video-providers-2026.json"
      - "config/zero-cost-video-production-manifest.json"
      - "src/meta_facebook_mcp_publisher/free_video.py"
      - "src/meta_facebook_mcp_publisher/free_stock.py"
      - "scripts/zero_cost_video_readiness.py"
      - "tests/test_free_video.py"
      - ".env.example"
  push:
    branches: [main]
    paths:
      - ".github/workflows/zero-cost-video-gate.yml"
      - "config/free-video-providers-2026.json"
      - "config/zero-cost-video-production-manifest.json"
      - "src/meta_facebook_mcp_publisher/free_video.py"
      - "src/meta_facebook_mcp_publisher/free_stock.py"
      - "scripts/zero_cost_video_readiness.py"
      - "tests/test_free_video.py"
      - ".env.example"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-cost-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install controlled test toolchain
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.4.2 .

      - name: Compile zero-cost implementation
        run: python -m compileall -q src tests scripts

      - name: Validate hard USD 0 policy and tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_free_video.py
          python - <<'PY'
          import json
          from pathlib import Path
          catalog=json.loads(Path('config/free-video-providers-2026.json').read_text())
          manifest=json.loads(Path('config/zero-cost-video-production-manifest.json').read_text())
          assert catalog['policy']['max_external_cash_cost_usd'] == 0.0
          assert catalog['policy']['autonomous_purchase_allowed'] is False
          assert manifest['max_external_cash_cost_usd'] == 0.0
          assert manifest['autonomous_purchase_allowed'] is False
          assert manifest['paid_fallback_allowed'] is False
          print('ZERO_COST_FINOPS=PASS')
          PY

      - name: Generate runtime readiness evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts
          PYTHONPATH=src python scripts/zero_cost_video_readiness.py > artifacts/zero-cost-video-readiness.json
          cat artifacts/zero-cost-video-readiness.json

      - name: Upload zero-cost evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zero-cost-video-readiness-${{ github.sha }}
          path: |
            config/free-video-providers-2026.json
            config/zero-cost-video-production-manifest.json
            artifacts/zero-cost-video-readiness.json
          if-no-files-found: error
