name: zero-cost-video-gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zero-cost-video-gate.yml"
      - "pyproject.toml"
      - "config/free-video-providers-2026.json"
      - "config/zero-cost-video-production-manifest.json"
      - "src/meta_facebook_mcp_publisher/data/free-video-providers-2026.json"
      - "src/meta_facebook_mcp_publisher/free_video.py"
      - "src/meta_facebook_mcp_publisher/free_stock.py"
      - "scripts/zero_cost_video_readiness.py"
      - "scripts/e2e_zero_cost_real_video.py"
      - "tests/test_free_video.py"
      - ".env.example"
  push:
    branches: [main]
    paths:
      - ".github/workflows/zero-cost-video-gate.yml"
      - "pyproject.toml"
      - "config/free-video-providers-2026.json"
      - "config/zero-cost-video-production-manifest.json"
      - "src/meta_facebook_mcp_publisher/data/free-video-providers-2026.json"
      - "src/meta_facebook_mcp_publisher/free_video.py"
      - "src/meta_facebook_mcp_publisher/free_stock.py"
      - "scripts/zero_cost_video_readiness.py"
      - "scripts/e2e_zero_cost_real_video.py"
      - "tests/test_free_video.py"
      - ".env.example"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-cost-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install deterministic media runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 3
          ffprobe -version | head -n 1

      - name: Install controlled Python test toolchain
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.4.2 build==1.3.0 .

      - name: Compile source
        run: python -m compileall -q src tests scripts

      - name: Prove provider catalog is packaged in wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cineforge-dist /tmp/cineforge-wheel-venv
          python -m build --wheel --outdir /tmp/cineforge-dist
          python -m venv /tmp/cineforge-wheel-venv
          /tmp/cineforge-wheel-venv/bin/pip install --disable-pip-version-check /tmp/cineforge-dist/*.whl
          cd /tmp
          /tmp/cineforge-wheel-venv/bin/python - <<'PY'
          from meta_facebook_mcp_publisher.free_video import load_catalog
          c = load_catalog()
          assert c['schema_version'] >= 2
          assert c['policy']['max_external_cash_cost_usd'] == 0.0
          print('PACKAGED_CATALOG=PASS')
          PY

      - name: Run unit integration and adversarial tests
        run: python -m pytest -q

      - name: Validate hard USD 0 policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          catalog=json.loads(Path('config/free-video-providers-2026.json').read_text())
          packaged=json.loads(Path('src/meta_facebook_mcp_publisher/data/free-video-providers-2026.json').read_text())
          manifest=json.loads(Path('config/zero-cost-video-production-manifest.json').read_text())
          assert catalog == packaged
          assert catalog['policy']['max_external_cash_cost_usd'] == 0.0
          assert catalog['policy']['autonomous_purchase_allowed'] is False
          assert catalog['policy']['paid_fallback_allowed'] is False
          assert manifest['max_external_cash_cost_usd'] == 0.0
          assert manifest['autonomous_purchase_allowed'] is False
          assert manifest['paid_fallback_allowed'] is False
          wan=next(p for p in catalog['providers'] if p['id']=='wan22_local')
          assert wan['native_1080_vertical'] == 'no'
          assert wan['max_native_resolution'] == '720p'
          print('ZERO_COST_FINOPS=PASS')
          print('NATIVE_RESOLUTION_TRUTH=PASS')
          PY

      - name: Scan repository for obvious embedded provider secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(sk-proj-[A-Za-z0-9_-]{12,}|nvapi-[A-Za-z0-9_-]{12,}|AIza[0-9A-Za-z_-]{20,})' -- ':!*.md'; then
            echo 'SECRET_PATTERN_SCAN=FAIL'
            exit 1
          fi
          echo 'SECRET_PATTERN_SCAN=PASS'

      - name: Generate runtime readiness evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/zero_cost_video_readiness.py --require-real-footage-ready > artifacts/zero-cost-video-readiness.json
          cat artifacts/zero-cost-video-readiness.json

      - name: Run keyless real-video E2E
        shell: bash
        run: |
          set -euo pipefail
          python scripts/e2e_zero_cost_real_video.py > /tmp/e2e.log
          cat /tmp/e2e.log
          test -s artifacts/e2e-real-video-evidence.json

      - name: Upload zero-cost evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zero-cost-video-readiness-${{ github.sha }}
          path: |
            config/free-video-providers-2026.json
            config/zero-cost-video-production-manifest.json
            artifacts/zero-cost-video-readiness.json
            artifacts/e2e-real-video-evidence.json
          if-no-files-found: error
