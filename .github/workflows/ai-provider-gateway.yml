name: ai-provider-gateway

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt for the AI provider gateway"
        required: true
      dry_run:
        description: "Validate provider configuration without calling external APIs"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ai-gateway:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install .

      - name: Compile
        run: python -m compileall -q src tests

      - name: Run AI provider gateway
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_NIM_ENABLED: ${{ vars.NVIDIA_NIM_ENABLED || 'false' }}
          NVIDIA_NIM_MODEL: ${{ vars.NVIDIA_NIM_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b' }}
          NVIDIA_NIM_BASE_URL: ${{ vars.NVIDIA_NIM_BASE_URL || 'https://integrate.api.nvidia.com/v1' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_ENABLED: ${{ vars.GROQ_ENABLED || 'false' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_INFERENCE_ENABLED: ${{ vars.HF_INFERENCE_ENABLED || 'false' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_ENABLED: ${{ vars.GEMINI_ENABLED || 'false' }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          python -m meta_facebook_mcp_publisher.ai_cli \
            --task "production-agent-routing" \
            --prompt "${{ inputs.prompt }}" \
            $FLAGS

