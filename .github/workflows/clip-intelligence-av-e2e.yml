name: clip-intelligence-av-e2e

on:
  pull_request:
    branches: [main]
    paths:
      - "src/meta_facebook_mcp_publisher/clip_*.py"
      - "tests/test_clip_intelligence.py"
      - "docs/CLIP_INTELLIGENCE_INTEGRATION_20261107.md"
      - ".github/workflows/clip-intelligence-av-e2e.yml"
  push:
    branches: [main]
    paths:
      - "src/meta_facebook_mcp_publisher/clip_*.py"
      - "tests/test_clip_intelligence.py"
      - ".github/workflows/clip-intelligence-av-e2e.yml"

permissions:
  contents: read

jobs:
  ffmpeg-real-video:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up controlled Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install mandatory open-source video codecs
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install controlled tests and package
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.4.2 .

      - name: Run real encoded AV fixture and fail-closed gates
        env:
          CINEFORGE_REQUIRE_AV_E2E: "1"
        run: |
          set -euo pipefail
          python -m compileall -q src/meta_facebook_mcp_publisher/clip_intelligence.py src/meta_facebook_mcp_publisher/clip_cli.py
          python -m pytest -q -rs tests/test_clip_intelligence.py
          echo "CINEFORGE_REAL_AV_E2E=PASS"
