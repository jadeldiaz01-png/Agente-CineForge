[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-facebook-mcp-publisher"
version = "0.1.1"
description = "Fail-closed Meta/Facebook Page video publisher scaffold for agentic video systems."
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.150,<3",
  "google-auth>=2.35,<3",
  "mcp>=1.20,<2",
]

[project.scripts]
cineforge-youtube-mcp = "meta_facebook_mcp_publisher.youtube_mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"meta_facebook_mcp_publisher" = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
