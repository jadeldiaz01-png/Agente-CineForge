[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-facebook-mcp-publisher"
version = "0.1.1"
description = "Fail-closed Meta/Facebook Page video publisher scaffold for agentic video systems."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"meta_facebook_mcp_publisher" = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
